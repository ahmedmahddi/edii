# Veille réglementaire, every week: read the JORT issues published since the last run (sommaires
# from ocr.jort.tn, then the whole text of the issues where texts were found, for their fiches),
# and commit what was read. The site is rebuilt from the repository (Vercel deploys on push; the
# feed is derived from data/veille/sommaires at build), so every user gets the new texts.
#
# Also run on demand: from the Actions tab ("Run workflow"), or by the "Vérifier maintenant"
# button of the app when its deployment holds VEILLE_GITHUB_TOKEN (app/api/veille/route.ts).
# GitHub runs scheduled workflows from the default branch only.
name: Veille JORT

on:
  schedule:
    - cron: "17 5 * * 1" # Monday 05:17 UTC, 06:17 in Tunis
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-jort
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lire les numéros parus
        run: npm run veille
      - name: Enregistrer les numéros lus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille/sommaires data/veille/fiches
          if git diff --cached --quiet; then
            echo "Aucun nouveau numéro."
            exit 0
          fi
          git commit -m "Veille: JORT lu le $(date -u +%F)"
          git pull --rebase
          git push
